<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isaac Korean Quiz - Trial Attempt 1</title><style>body{font-family:Arial,sans-serif;background:#f6f8f5;color:#263d35;margin:0}header{position:sticky;top:0;background:white;padding:15px;box-shadow:0 2px 10px #0001}main{max-width:650px;margin:auto;padding:20px}h1{font-size:21px}.bar{background:#e5eee7;border-radius:20px;position:relative;height:26px;text-align:center;overflow:hidden}.fill{height:100%;background:#b3d9b8;width:0;transition:.3s}.counter{position:absolute;inset:0;line-height:26px;color:#377031;font-weight:bold}.card{background:white;padding:20px;border-radius:18px;margin:18px 0;box-shadow:0 2px 8px #0001}.flag{float:right;background:#fff1c5}.flag.on{background:#f7ca6b}button,input{font:inherit;border:1px solid #d0ddd4;border-radius:10px;padding:10px;margin:4px;background:#fafdfa}button{cursor:pointer}.option{display:block;width:100%;text-align:left}.option.chosen{background:#d8eedb}.good{color:#377031}.bad{color:#ba3950}.question{cursor:pointer;font-weight:bold;padding:10px 0}.hint{display:none;background:#fff4c2;padding:10px;border-radius:10px}.review .hint{display:block}.controls{display:flex;justify-content:space-between;align-items:center}#reset:disabled{opacity:.35}dialog{border:0;border-radius:18px;box-shadow:0 10px 40px #0004;padding:25px}dialog::backdrop{background:#0006}</style></head><body><header><div style="max-width:650px;margin:auto"><h1>Isaac's Korean Quiz · Trial Attempt 1</h1><div class="controls"><button id="reset" disabled>Reset</button><strong id="clock">1 hour 30 minutes</strong></div><div class="bar"><div class="fill" id="fill"></div><div class="counter" id="counter">0 out of 5</div></div></div></header><main id="main"></main><dialog id="modal"><h2 id="mt">Quiz Complete!</h2><p id="ms"></p><button id="close">Close ✕</button><button id="download">Download Score</button></dialog><script>
const questions=[
{q:'다음 중 모음은 무엇인가요?',o:['ㅏ','ㄱ','ㄴ','ㅁ'],a:0,t:'Which of the following is a vowel?',tr:['vowel ㅏ','consonant ㄱ','consonant ㄴ','consonant ㅁ'],why:'ㅏ is a vowel; the others are consonants.'},
{q:'“아빠”는 영어로 무엇인가요?',o:['Dad','Mother','Brother','Grandmother'],a:0,t:'What does 아빠 mean in English?',tr:['Dad','Mother','Brother','Grandmother'],why:'아빠 means dad or father.'},
{q:'여자가 자기보다 나이가 많은 여자 형제를 부를 때 쓰는 말은?',o:['언니','누나','오빠','형'],a:0,t:'What does a girl call her older sister?',tr:['Older sister (said by a girl)','Older sister (said by a boy)','Older brother (said by a girl)','Older brother (said by a boy)'],why:'A girl calls her older sister 언니.'},
{q:'“책상 위에”는 무슨 뜻인가요?',o:['On the desk','Under the desk','Beside the desk','Behind the desk'],a:0,t:'What does 책상 위에 mean?',tr:['On the desk','Under the desk','Beside the desk','Behind the desk'],why:'위에 means on or above.'},
{q:'“도서관”은 어떤 장소인가요?',o:['책을 읽는 곳','음식을 사는 곳','운동하는 곳','잠을 자는 곳'],a:0,t:'What kind of place is a library?',tr:['A place to read books','A place to buy food','A place to exercise','A place to sleep'],why:'도서관 is a library.'}
];let answers={},flags=new Set(),done=false,start=Date.now(),resets=0;const el=id=>document.getElementById(id);
function render(){let root=el('main');root.innerHTML='';questions.forEach((q,i)=>{let card=document.createElement('section');card.className='card'+(done?' review':'');let flag=document.createElement('button');flag.className='flag'+(flags.has(i)?' on':'');flag.textContent=flags.has(i)?'⚑':'⚐';flag.title='Flag question';flag.onclick=()=>{flags.has(i)?flags.delete(i):flags.add(i);render()};card.append(flag);let heading=document.createElement('div');heading.className='question';heading.textContent=(i+1)+'. '+q.q;heading.onclick=()=>{if(done)alert(q.t)};card.append(heading);q.o.forEach((option,j)=>{let b=document.createElement('button');b.className='option'+(answers[i]===j?' chosen':'');b.textContent=option;if(done){b.textContent+=' '+(j===q.a?'✓':answers[i]===j?'×':'');if(j===q.a)b.classList.add('good');if(answers[i]===j&&j!==q.a)b.classList.add('bad')}b.onclick=()=>{if(done){alert(q.tr[j]);return}if(answers[i]!==undefined)return;answers[i]=j;render();progress()};card.append(b)});if(done&&answers[i]!==q.a){let b=document.createElement('button');b.textContent='Click Reveal';b.onclick=()=>alert(q.why);card.append(b)}root.append(card)})}
function progress(){let n=Object.keys(answers).length;el('counter').textContent=n+' out of 5';el('fill').style.width=(n*20)+'%';if(n===5&&!done){done=true;el('reset').disabled=false;let score=questions.filter((q,i)=>answers[i]===q.a).length;el('mt').textContent='Quiz complete!';el('ms').textContent='Score: '+score+' out of 5. Close to review answers.';render();el('modal').showModal()}}
el('close').onclick=()=>el('modal').close();el('reset').onclick=()=>{resets++;answers={};flags.clear();done=false;start=Date.now();el('reset').disabled=true;render();progress()};el('download').onclick=()=>{let score=questions.filter((q,i)=>answers[i]===q.a).length;let txt=['Filename: korean_trial1.html','Reset count: '+resets,'Duration (minutes): '+((Date.now()-start)/60000).toFixed(1),'Total score: '+score+' out of 5','Wrong question numbers: '+questions.map((q,i)=>answers[i]!==q.a?i+1:'').filter(Boolean).join(', '),'Feedback question numbers: '+[...flags].map(i=>i+1).sort((a,b)=>a-b).join(', ')].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='korean_trial1_score.txt';a.click()};setInterval(()=>{if(done)return;let s=Math.max(0,5400-Math.floor((Date.now()-start)/1000));el('clock').textContent=s===5400?'1 hour 30 minutes':Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m '+s%60+'s';if(s===0){done=true;el('reset').disabled=false;el('mt').textContent='Time is up!';el('ms').textContent='Time has ended. Reset to try again.';render();el('modal').showModal()}},1000);render();</script></body></html>
