<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isaac's Korean Quiz — Trial Attempt 1</title><style>
:root{font-family:Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#27352c;background:#fdfbf8}*{box-sizing:border-box}body{margin:0}main{max-width:1060px;margin:auto;padding:20px 15px 60px}.top{position:sticky;top:0;z-index:5;background:#fdfbf8;display:grid;grid-template-columns:max-content minmax(170px,1fr) auto auto;gap:24px;align-items:center;border-bottom:1px solid #eee5dd;padding:15px 0 19px}.top h1{font-size:clamp(21px,2.6vw,29px);margin:0;white-space:nowrap}.progress{height:43px;border:2px solid #377031;background:#eef5eb;border-radius:999px;position:relative;overflow:hidden}.done{height:100%;width:0;background:#a9d5a3;transition:width .3s}.progress-count{position:absolute;inset:0;display:grid;place-items:center;color:#265a25;font-weight:bold;font-size:14px}.reset,.timer{height:43px;border:0;border-radius:15px;padding:0 18px;font-weight:bold;white-space:nowrap;display:flex;align-items:center;justify-content:center}.reset{background:#ffe4e1;color:#874b49;cursor:pointer}.reset:disabled{opacity:.4}.timer{background:#dcebf9;color:#244e78;font-size:14px}.intro{font-size:13px;color:#727575;margin:17px 3px 24px}.q{background:white;border:1px solid #e6e2dc;border-radius:19px;box-shadow:0 2px 8px #00000008;padding:21px;margin:16px 0}.qhead{font-size:20px;line-height:1.65;margin-bottom:16px;display:flex;align-items:flex-start;gap:8px}.num{font-weight:800;color:#377031}.review{flex:1;cursor:default}.review.unlocked{cursor:pointer}.question-flag{border:0;border-radius:8px;background:#f8f3e9;padding:5px 9px;cursor:pointer;color:#927744}.question-flag.active{background:#ffe3a1}.options{display:grid;gap:3px}.option{display:grid;grid-template-columns:minmax(0,1fr) 32px 30px;gap:9px;align-items:center;padding:8px 2px;min-height:50px}.option+.option{border-top:1px solid #f2ece8}.option .review{font-size:18px}.answer-circle,.submit{height:29px;width:29px;border:2px solid #8c9b8e;background:white;border-radius:50%;cursor:pointer;font-size:16px;font-weight:bold}.answer-circle:disabled,.submit:disabled{cursor:default}.answer-circle.good,.submit.good{background:#377031;color:white;border-color:#377031}.answer-circle.bad,.submit.bad{background:#bb4d58;color:white;border-color:#bb4d58}.status{font-weight:800;font-size:21px;text-align:center}.status.good{color:#377031}.status.bad{color:#b64050}.status.explain{cursor:pointer}.type{display:grid;grid-template-columns:minmax(0,1fr) 32px 30px;gap:9px;align-items:center}.type input{min-width:0;border:1px solid #d9bfc4;border-radius:10px;padding:12px;font-size:19px}.drag-source,.dropzone{border:2px dashed #c6adb6;border-radius:12px;min-height:57px;padding:10px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}.dropzone{background:#fcfaf8}.tile{background:#d9f0ed;border:1px solid #8cbcb5;border-radius:9px;padding:9px 12px;cursor:pointer;font-size:17px;touch-action:manipulation}.dropzone .tile{background:#fce6bf}.order-row{display:grid;grid-template-columns:minmax(0,1fr) 32px 30px;gap:9px;align-items:center;margin-top:10px}.tip{position:fixed;z-index:50;max-width:min(320px,85vw);background:#fff0b5;color:#5b4319;padding:12px 15px;border:1px solid #e5cf84;border-radius:12px;box-shadow:0 8px 22px #382d2b1f;font-size:15px;line-height:1.5}.tip[hidden],.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;background:#fffaf5;z-index:20;display:grid;place-items:center;padding:20px;overflow:auto}.result{max-width:560px;width:100%;text-align:center;background:white;border:3px solid #d7e8d1;border-radius:28px;padding:38px 22px;position:relative;box-shadow:0 15px 40px #cfa8a72c;animation:appear .65s both}.result h2{font-size:36px;margin:8px}.result p{font-size:18px;line-height:1.5}.x{position:absolute;right:13px;top:9px;border:0;background:#ffe4e1;color:#85444b;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer}.download{border:0;border-radius:13px;background:#396d69;color:white;padding:12px 16px;cursor:pointer}.art{font-size:90px;margin:10px}.small{font-size:13px;color:#736c71}.feedback{font-size:13px;color:#6d5464}.scoreline{font-weight:bold;color:#377031}@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:800px){.top{grid-template-columns:1fr auto auto;gap:8px}.top h1{grid-column:1/-1;white-space:normal;font-size:21px}.progress{min-width:90px}.timer,.reset{padding:0 9px;font-size:12px}.q{padding:16px}.qhead{font-size:19px}}
</style></head><body><main><header class="top"><h1>Isaac's Korean Quiz · Trial Attempt 1</h1><div class="progress"><div id="done" class="done"></div><div id="progress-count" class="progress-count">0 out of 5</div></div><button class="reset" id="reset" disabled>Reset</button><div class="timer" id="timer">1 hour 30 minutes</div></header><p class="intro">Answer all five questions. Flag any question for feedback. Translations and answer explanations unlock after completion.</p><div id="questions"></div></main><div class="tip" id="tip" hidden></div><div class="overlay" id="overlay" hidden><div class="result"><button class="x" id="close" aria-label="Close">×</button><div class="art" id="art">🌟</div><h2 id="resulttitle"></h2><p id="resulttext"></p><p class="small" id="resultdetail"></p><p class="scoreline" id="scoreline"></p><button class="download" id="download">Download Score (TXT)</button></div></div><script>
const qs=[
{kind:'mc',q:'다음 중 모음은 무엇인가요?',opts:['ㅏ','ㄱ','ㄴ','ㅁ'],right:0,en:'Which of the following is a vowel?',trans:['Vowel a','Consonant g/k','Consonant n','Consonant m'],why:'ㅏ is a vowel; ㄱ, ㄴ and ㅁ are consonants.'},
{kind:'type',q:'“아빠”는 영어로 무엇인가요? 영어로 쓰세요.',answers:['dad','father','daddy'],en:'What does 아빠 mean in English? Write your answer in English.',why:'아빠 means dad or father.'},
{kind:'tf',q:'“언니”는 여자가 자기보다 나이가 많은 여자 형제를 부르는 말이에요. 맞아요, 아니에요?',opts:['맞아요','아니에요'],right:0,en:'True or false: A girl uses 언니 to refer to her older sister.',trans:['True','False'],why:'A girl calls her older sister 언니; a boy uses 누나.'},
{kind:'order',q:'주어진 단어를 순서대로 놓아 “The book is on the desk”라는 뜻의 문장을 완성하세요.',tiles:['있어요','책이','책상 위에'],correct:['책이','책상 위에','있어요'],en:'Put the words in order to say “The book is on the desk.”',why:'책이 책상 위에 있어요 means “The book is on the desk.”'},
{kind:'mc',q:'“도서관”은 어떤 장소인가요?',opts:['책을 읽는 곳','음식을 사는 곳','운동하는 곳','잠을 자는 곳'],right:0,en:'What kind of place is a library?',trans:['A place to read books','A place to buy food','A place to exercise','A place to sleep'],why:'도서관 means library.'}
];
const COUNT=qs.length,FILE='korean_trial1.html',STORE='isaac-korean-trial1-history';let answered=[],correct=[],flagged=new Set(),finished=false,completed=false,started=Date.now(),deadline=started+5400000,history=[];try{history=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}let resetCount=history.length;const $=id=>document.getElementById(id),root=$('questions');
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function showTip(e,s){if(!completed)return;let tip=$('tip');tip.textContent=s;tip.hidden=false;let r=e.target.getBoundingClientRect();tip.style.left=Math.max(10,Math.min(r.left,innerWidth-330))+'px';tip.style.top=Math.max(10,Math.min(r.bottom+10,innerHeight-tip.offsetHeight-10))+'px'}
function hideTip(){$('tip').hidden=true}document.addEventListener('click',e=>{if(!e.target.closest('.review,.tile,.status.explain,#tip'))hideTip()});
function update(){let n=answered.filter(v=>v!==undefined).length;$('done').style.width=(n/COUNT*100)+'%';$('progress-count').textContent=n+' out of '+COUNT;$('reset').disabled=!finished}
function submit(i,value,good,target){if(finished||answered[i]!==undefined)return;answered[i]=value;correct[i]=good;let box=root.children[i];box.querySelectorAll('.answer-circle,.submit,.tile').forEach(b=>b.disabled=true);box.querySelectorAll('input').forEach(b=>b.disabled=true);let circle=target.querySelector('.answer-circle,.submit');if(circle){circle.classList.add(good?'good':'bad');circle.textContent=''}let status=target.querySelector('.status');if(status){status.className='status '+(good?'good':'bad');status.textContent=good?'✓':'✕';if(!good){status.classList.add('explain');status.tabIndex=0;status.title='Click Reveal after completion';status.onclick=e=>showTip(e,qs[i].why)}}update();if(answered.filter(v=>v!==undefined).length===COUNT)finish()}
function build(){root.innerHTML='';qs.forEach((q,i)=>{let box=document.createElement('section');box.className='q';box.innerHTML='<div class="qhead"><span class="num">'+(i+1)+'.</span><span class="review">'+esc(q.q)+'</span><button class="question-flag" aria-label="Flag question '+(i+1)+'">⚑</button></div><div class="work"></div>';root.append(box);let flag=box.querySelector('.question-flag');flag.onclick=()=>{flagged.has(i+1)?flagged.delete(i+1):flagged.add(i+1);flag.classList.toggle('active',flagged.has(i+1))};box.querySelector('.qhead .review').onclick=e=>showTip(e,q.en);let work=box.querySelector('.work');if(q.kind==='mc'||q.kind==='tf'){work.className='work options';q.opts.forEach((o,j)=>{let row=document.createElement('div');row.className='option';row.innerHTML='<span class="review">'+esc(o)+'</span><button class="answer-circle" aria-label="Choose option '+(j+1)+'"></button><b class="status"></b>';row.querySelector('button').onclick=()=>submit(i,j,j===q.right,row);row.querySelector('.review').onclick=e=>showTip(e,q.trans[j]);work.append(row)})}else if(q.kind==='type'){work.className='work type';work.innerHTML='<input aria-label="Type your answer" autocomplete="off"><button class="submit" aria-label="Submit answer">○</button><b class="status"></b>';work.querySelector('button').onclick=()=>{let value=work.querySelector('input').value.trim().toLowerCase();if(value)submit(i,value,q.answers.includes(value),work)};work.querySelector('input').onkeydown=e=>{if(e.key==='Enter')work.querySelector('button').click()}}else{work.innerHTML='<div class="drag-source"></div><div class="order-row"><div class="dropzone"></div><span></span><b class="status"></b></div>';let src=work.querySelector('.drag-source'),dest=work.querySelector('.dropzone');q.tiles.forEach((w,j)=>{let b=document.createElement('button');b.className='tile';b.textContent=w;b.draggable=true;b.dataset.j=j;b.onclick=e=>{if(completed){showTip(e,{'있어요':'is / exists','책이':'the book (subject)','책상 위에':'on the desk'}[w]);return}if(answered[i]!==undefined)return;(b.parentElement===src?dest:src).append(b);check()};b.ondragstart=e=>e.dataTransfer.setData('text/plain',j);src.append(b)});dest.ondragover=e=>e.preventDefault();dest.ondrop=e=>{e.preventDefault();let b=work.querySelector('[data-j="'+e.dataTransfer.getData('text/plain')+'"]');if(b&&answered[i]===undefined){dest.append(b);check()}};function check(){if(dest.children.length!==q.tiles.length)return;let a=[...dest.children].map(b=>b.textContent);submit(i,a.join(' '),a.every((x,j)=>x===q.correct[j]),work)}}});update()}
function finish(){finished=true;completed=true;let n=correct.filter(Boolean).length,wrong=qs.map((_,i)=>correct[i]?null:i+1).filter(Boolean),minutes=Math.max(1,Math.ceil((Date.now()-started)/60000));let record={file:FILE,reset:resetCount,duration:minutes,score:n+'/'+COUNT,wrong:wrong.join(', ')||'-',feedback:[...flagged].sort((a,b)=>a-b).join(', ')||'-',numeric:n};let prior=history.length?history[history.length-1].numeric:null;history.push(record);try{localStorage.setItem(STORE,JSON.stringify(history))}catch(e){}$('art').textContent=n===5?'🏆':n>=3?'🌟':n>=1?'💪':'🌱';$('resulttitle').textContent=n+' / '+COUNT+' ('+Math.round(n/COUNT*100)+'%)';$('resulttext').textContent=prior===null?'You finished! Great effort, Isaac!':n>prior?'Wonderful progress! Your hard work is showing!':n<prior?'Keep going! Every try helps you learn.':'Nice consistency! Keep practising!';$('resultdetail').textContent='Time: '+minutes+' min · Attempt '+(resetCount+1);$('scoreline').textContent=COUNT+' / '+COUNT+' answered';$('download').hidden=false;update();setTimeout(()=>$('overlay').hidden=false,650)}
function restart(){flagged.clear();answered=[];correct=[];finished=false;completed=false;resetCount=history.length;started=Date.now();deadline=started+5400000;$('overlay').hidden=true;hideTip();build()}$('reset').onclick=restart;$('close').onclick=()=>$('overlay').hidden=true;$('download').onclick=()=>{let txt=history.map(r=>[r.file,r.reset,r.duration,r.score,r.wrong,r.feedback].join(' / ')).join('\n')+'\n';let url=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='korean_trial1_score.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
setInterval(()=>{if(finished)return;let t=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent=Math.floor(t/3600)+' hour'+(Math.floor(t/3600)===1?'':'s')+' '+Math.floor(t%3600/60)+' minute'+(Math.floor(t%3600/60)===1?'':'s');if(!t){finished=true;$('art').textContent='⏳';$('resulttitle').textContent='Time is up!';$('resulttext').textContent='A fresh start is ready whenever you are.';$('resultdetail').textContent='';$('download').hidden=true;$('overlay').hidden=false;$('close').onclick=restart;update()}},250);build();
</script></body></html>
