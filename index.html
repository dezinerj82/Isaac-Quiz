<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Quiz time</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--yellow:#FFC349;--purple:#525EA7;--blue:#5FACD3;--aqua:#97DDE9;--ink:#29335f;--pink:#dc42bd;--shadow:0 6px 0 #29335f16,0 12px 22px #29335f15}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:white;color:var(--ink);font-family:Fredoka,Nunito,Arial,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}.screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(18px,4vw,50px);width:100%}.hidden{display:none!important}.rainbow{font-weight:700;font-size:clamp(48px,9vw,105px);letter-spacing:.015em;line-height:1.1;text-align:center;margin:0 0 clamp(30px,6vh,65px)}.rainbow span:nth-child(4n+1){color:var(--yellow)}.rainbow span:nth-child(4n+2){color:var(--purple)}.rainbow span:nth-child(4n+3){color:var(--blue)}.rainbow span:nth-child(4n){color:#68bdc9}.tilegrid{width:min(760px,100%);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.4vw,24px)}.tile,.version{border:0;border-radius:27px;box-shadow:var(--shadow);font-weight:700;color:white;transition:transform .15s,box-shadow .15s}.tile{min-height:clamp(110px,17vw,165px);font-size:clamp(20px,3vw,31px);padding:16px}.tile:nth-child(4n+1){background:var(--purple)}.tile:nth-child(4n+2){background:var(--blue)}.tile:nth-child(4n+3){background:#5bbcc8}.tile:nth-child(4n){background:#f0b83d;color:#29335f}.tile:hover,.version:hover,.pill:hover{transform:translateY(-2px)}.tile:active,.version:active,.pill:active{transform:translateY(2px);box-shadow:0 2px 6px #29335f1c}.versionlist{display:grid;gap:16px;width:min(570px,100%)}.version{min-height:72px;font-size:clamp(20px,3vw,27px);background:var(--purple);padding:16px 24px;text-align:center}.version:nth-child(2n){background:var(--blue)}.back{position:absolute;top:24px;left:clamp(18px,4vw,50px);border:0;background:#edf4fc;color:var(--purple);border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}.quizscreen{justify-content:flex-start;gap:clamp(16px,3vh,28px)}.topbar{display:flex;align-items:center;gap:clamp(9px,2vw,22px);width:min(1120px,100%);flex-wrap:wrap}.subjectpill{font-size:clamp(18px,2.5vw,28px);font-weight:700;color:var(--purple)}.timer{display:flex;align-items:center;gap:10px;border-radius:999px;background:linear-gradient(110deg,#bc44d1,#e54eb6);color:white;font-size:clamp(18px,2.5vw,25px);font-weight:700;padding:8px 20px;box-shadow:0 5px 10px #9b35a83b}.clockicon{background:white;color:var(--pink);width:37px;height:37px;border-radius:50%;display:grid;place-items:center;font-size:24px;box-shadow:0 2px 6px #52235b4a}.progressgroup{display:flex;align-items:center;gap:12px;flex:1;min-width:180px}.progress{height:34px;border-radius:999px;border:3px solid white;box-shadow:0 0 0 2px #a4a5ec,0 3px 8px #29335f1a;background:#e6ecff;overflow:hidden;flex:1}.progressfill{height:100%;width:0;background:linear-gradient(90deg,#bd44d3,#e34ab9);border-radius:999px;transition:width .3s}.percent{font-size:clamp(19px,2.8vw,29px);font-weight:700;color:var(--purple)}.pill{border:0;background:linear-gradient(120deg,#bd44d3,#e247b6);color:white;border-radius:999px;box-shadow:0 5px 0 #aa2c8d24,0 8px 13px #76245b30;padding:13px 24px;font-size:clamp(18px,2.5vw,25px);font-weight:700}.questioncard{width:min(960px,100%);margin:auto;display:flex;flex-direction:column;gap:clamp(16px,3vh,27px);border-radius:36px;background:white;border:3px solid #edf3fb;box-shadow:0 12px 38px #525ea716;padding:clamp(22px,4vw,48px)}.number{width:49px;height:49px;border-radius:50%;display:grid;place-items:center;background:#3919a7;color:white;font-size:27px;font-weight:700;box-shadow:0 4px 8px #36168e2b}.questiontitle{font-size:clamp(24px,3.5vw,38px);font-weight:700;margin:0}.prompt{font-size:clamp(23px,3.2vw,35px);margin:0;text-align:center;line-height:1.5}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.answer{border:2px solid #dce7f4;background:#f6fbff;color:var(--ink);border-radius:22px;min-height:76px;padding:13px 17px;font-size:clamp(18px,2.5vw,25px);font-weight:600;text-align:left;display:flex;align-items:center;gap:13px;box-shadow:0 4px 0 #dbe8f0}.answer .letter{flex:0 0 38px;height:38px;border-radius:50%;background:var(--aqua);display:grid;place-items:center;color:#23406e;font-weight:700}.answer.selected{border-color:var(--purple);background:#e9eaf8;box-shadow:0 0 0 2px #525ea72e}.helper{text-align:center;color:#6b7792;font-size:16px;margin:0}.overlay{position:fixed;inset:0;background:#242d6173;display:grid;place-items:center;z-index:10;padding:20px}.feedback{width:min(490px,100%);background:white;border-radius:35px;padding:24px;box-shadow:0 20px 55px #11183e54;text-align:center;cursor:pointer}.feedbackhead{border-radius:999px;background:var(--purple);color:white;font-size:clamp(27px,5vw,38px);font-weight:700;padding:16px;margin-bottom:16px}.feedbackhead.wrong{background:#d44f9b}.feedbackbody{border-radius:23px;background:#eff8fc;padding:22px;font-size:clamp(19px,3vw,24px);line-height:1.5}.feedbackhint{font-size:15px;color:#6a7491;margin-top:17px}.resultscreen{background:linear-gradient(145deg,#b0c5ff,#a7b9f9 62%,#e2d3ff);position:relative;overflow:hidden}.resultpanel{background:#fff;border-radius:46px;padding:clamp(28px,5vw,55px);box-shadow:0 10px 24px #394ca83a;width:min(560px,100%);text-align:center;z-index:1}.resultpanel h2{color:#32108d;font-size:clamp(37px,6vw,60px);margin:0 0 12px}.resultlabel{font-size:clamp(21px,3vw,29px);font-weight:700}.resultscore{font-size:clamp(62px,10vw,100px);font-weight:700;color:#bd42bb;line-height:1.25;margin:0 0 15px}.resultscore .slash{color:#3710a1}.resultbutton{display:block;width:100%;border:0;border-radius:999px;color:white;font-size:clamp(18px,2.8vw,24px);font-weight:700;padding:15px;margin:13px 0;box-shadow:0 6px 9px #1c25522a}.resultbutton:nth-of-type(1){background:#5b23c5}.resultbutton:nth-of-type(2){background:#3985d7}.resultbutton:nth-of-type(3){background:#192f68}.scorestar{font-size:60px;color:var(--yellow);filter:drop-shadow(0 4px 2px #c48a1d55)}@media(max-width:650px){.screen{padding:20px 15px}.tilegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:110px}.back{top:14px;left:14px}.selectionscreen{padding-top:78px}.quizscreen{padding-top:18px}.topbar{gap:10px}.subjectpill{order:0;flex:1}.timer{order:1;padding:6px 12px}.progressgroup{order:2;flex-basis:calc(100% - 108px)}.pill{order:3;padding:11px 17px}.questioncard{margin:12px auto;gap:19px;border-radius:26px}.answers{grid-template-columns:1fr}.answer{min-height:65px}.resultpanel{border-radius:32px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
 .questionheading{display:flex;align-items:flex-start;gap:18px}.questionheading .number{flex-shrink:0}.questionheading .questiontitle{margin:0;line-height:1.4;flex:1}.resultscore{margin-top:12px}@media(max-width:650px){.topbar .progressgroup{order:1;flex-basis:calc(100% - 115px)}.topbar .timer{order:2;flex:0 0 auto}.topbar .pill{order:3}.questionheading{gap:12px}.questionheading .number{width:42px;height:42px;font-size:23px}} </style></head><body>
<main id="home" class="screen"><h1 class="rainbow" data-rainbow="Quiz time">Quiz time</h1><div class="tilegrid" id="subjects"></div></main>
<section id="selection" class="screen selectionscreen hidden"><button class="back" onclick="home()">‹ Back</button><h1 class="rainbow" id="subjectTitle"></h1><div class="versionlist" id="versions"></div></section>
<section id="quiz" class="screen quizscreen hidden"><div class="topbar"><div class="subjectpill" id="quizSubject"></div><div class="progressgroup"><div class="progress"><div class="progressfill" id="progressfill"></div></div><span class="percent" id="percent">0%</span></div><div class="timer"><span class="clockicon">◷</span><span id="timer">15:00</span></div><button class="pill" onclick="submitAnswer()">Next ❯</button></div><div class="questioncard"><div class="questionheading"><div class="number" id="number">1</div><h2 class="questiontitle" id="questionTitle"></h2></div><p class="prompt" id="prompt"></p><div class="answers" id="answers"></div><p class="helper">Select your answer, then press Next.</p></div></section>
<div class="overlay hidden" id="overlay" onclick="advance()"><div class="feedback" role="dialog" aria-modal="true"><div class="feedbackhead" id="feedbackhead">Correct!</div><div class="feedbackbody" id="explanation"></div><div class="feedbackhint">Tap anywhere to continue</div></div></div>
<section id="results" class="screen resultscreen hidden"><div class="resultpanel"><h2>Quiz Complete!</h2><div class="resultlabel">Your Score</div><div class="resultscore"><span id="score">0</span><span class="slash"> / </span><span id="total">5</span></div><button class="resultbutton" onclick="restart()">⟳ &nbsp; Try Again</button><button class="resultbutton" onclick="home()">⌂ &nbsp; Back to Home</button><button class="resultbutton" onclick="downloadScore()">↧ &nbsp; Download Score</button></div></section>
<script>
const names=['English','Korean','Malay','Math','Science','PJPK'];const colors=['#FFC349','#525EA7','#5FACD3','#97DDE9'];const $=id=>document.getElementById(id);let subject='',version=1,questions=[],index=0,selected=-1,score=0,time=900,timerHandle=null,answered=false;const sample={
English:[['Choose the correct sentence.',['She is happy.','She are happy.','She am happy.','She be happy.'],0,'“She” uses “is” in the present tense.'],['What is the opposite of “hot”?',['Warm','Cold','Bright','Fast'],1,'“Cold” is the opposite of “hot”.']],
Korean:[['“학교” means…',['Hospital','School','Market','Library'],1,'학교 (hakgyo) means school.'],['Choose the Korean word for “apple”.',['사과','학교','고양이','책'],0,'사과 (sagwa) means apple.']],
Malay:[['Pilih perkataan yang betul: Saya _____ nasi.',['tidur','makan','baca','lari'],1,'“Makan” means to eat.'],['Apakah lawan kata “besar”?',['tinggi','panjang','kecil','cepat'],2,'“Kecil” means small, the opposite of big.']],
Math:[['What is 24 + 18?',['40','42','44','46'],1,'24 + 18 = 42.'],['What is 7 × 6?',['36','40','42','48'],2,'7 × 6 = 42.']],
Science:[['Which part of a plant absorbs water?',['Flower','Leaf','Root','Fruit'],2,'Roots absorb water from the soil.'],['Water freezes into…',['Steam','Ice','Air','Sand'],1,'Water becomes ice when it freezes.']],
PJPK:[['What should you do before exercising?',['Warm up','Sleep','Eat sweets','Sit still'],0,'Warming up prepares your muscles for activity.'],['What is the best drink after exercise?',['Soda','Water','Coffee','Syrup'],1,'Water helps replace fluids lost during exercise.']]};
function rainbow(s){return [...s].map((c,i)=>c===' '?' ': '<span style="color:'+colors[i%4]+'">'+c+'</span>').join('')}
function show(id){document.querySelectorAll('.screen').forEach(el=>el.classList.add('hidden'));$(id).classList.remove('hidden');window.scrollTo(0,0)}
function home(){clearInterval(timerHandle);show('home')}
function choose(s){subject=s;clearInterval(timerHandle);$('subjectTitle').innerHTML=rainbow(s);$('versions').innerHTML=Array.from({length:5},(_,i)=>'<button class="version" onclick="start('+(i+1)+')">'+s+' volume '+(i+1)+'</button>').join('');show('selection')}
function start(v){version=v;index=0;score=0;time=900;questions=sample[subject].map(q=>({q:q[0],options:q[1],correct:q[2],explanation:q[3]}));$('quizSubject').textContent=subject;show('quiz');render();clearInterval(timerHandle);timerHandle=setInterval(()=>{time--;updateClock();if(time<=0)finish()},1000)}
function updateClock(){let m=Math.floor(Math.max(0,time)/60),s=Math.max(0,time)%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function render(){selected=-1;answered=false;let q=questions[index];$('number').textContent=index+1;$('questionTitle').textContent=q.q;$('prompt').textContent='';$('answers').innerHTML=q.options.map((o,i)=>'<button class="answer" data-i="'+i+'" onclick="selectAnswer('+i+')"><span class="letter">'+('ABCD'[i])+'</span><span></span></button>').join('');[...$('answers').children].forEach((b,i)=>b.lastElementChild.textContent=q.options[i]);let pct=Math.round(index/questions.length*100);$('progressfill').style.width=pct+'%';$('percent').textContent=pct+'%';updateClock()}
function selectAnswer(i){if(answered)return;selected=i;[...$('answers').children].forEach((b,j)=>b.classList.toggle('selected',j===i))}
function submitAnswer(){if(answered||selected<0)return;answered=true;let q=questions[index],correct=selected===q.correct;if(correct)score++;$('feedbackhead').textContent=correct?'Correct!':'Wrong!';$('feedbackhead').classList.toggle('wrong',!correct);$('explanation').textContent=q.explanation;$('overlay').classList.remove('hidden')}
function advance(){if(!answered)return;$('overlay').classList.add('hidden');index++;if(index>=questions.length)finish();else render()}
function finish(){clearInterval(timerHandle);$('overlay').classList.add('hidden');$('score').textContent=score;$('total').textContent=questions.length;show('results')}
function restart(){start(version)}
function downloadScore(){let content='Quiz time\nSubject: '+subject+'\nQuiz: '+subject+' volume '+version+'\nScore: '+score+'/'+questions.length+'\nDate: '+new Date().toLocaleString();let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'text/plain'}));a.href=url;a.download='score.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
$('subjects').innerHTML=names.map(n=>'<button class="tile" onclick="choose(\''+n+'\')">'+n+'</button>').join('');document.querySelector('#home .rainbow').innerHTML=rainbow('Quiz time');let initial=new URLSearchParams(location.search).get('subject');if(initial){let match=names.find(n=>n.toLowerCase()===initial.toLowerCase());if(match)choose(match)}
</script></body></html>
