/* Keep header and question card on the same responsive width and in one vertical flow. */
.quizscreen{justify-content:flex-start;align-items:center;gap:clamp(18px,3vw,30px)}
.quizscreen .topbar,.quizscreen .questioncard{width:min(960px,100%);max-width:960px}
.quizscreen .topbar{flex:0 0 auto;gap:clamp(9px,1.3vw,16px)}
.quizscreen .questioncard{margin:0;flex:0 0 auto}
.quizscreen .progressgroup{min-width:0;flex:1 1 160px;flex-wrap:nowrap;justify-content:initial;gap:clamp(7px,1vw,12px)}
.quizscreen .progress{min-width:45px}
.quizscreen .percent,.quizscreen .remaining{flex:0 0 auto}
.quizscreen .remaining{margin-left:0}
.quizscreen .quizactions{flex:0 0 auto}
@media(max-width:850px){

 .quizscreen .subjectpill{grid-column:1;grid-row:1;order:unset;flex:none!important}

 .quizscreen .timer{grid-column:1 / 2;grid-row:2;order:unset;justify-self:start;flex:none}
 .quizscreen .quizactions{grid-column:2 / 4;grid-row:2;order:unset;justify-self:end;margin-left:0;flex:none}
}
@media(max-width:420px){

const names=['English','Korean','Malay','Math','Science','PJPK'];const colors=['#FFC349','#525EA7','#5FACD3','#97DDE9'];const $=id=>document.getElementById(id);let subject='',version=1,questions=[],index=0,selected=-1,score=0,time=900,timerHandle=null,answered=false,wrongQuestions=[];const sample={"English":[],"Korean":[["Which vowel represents the sound 'a' as in 아?",["ㅏ","ㅓ","ㅗ","ㅜ"],0,"ㅏ combines with ㅇ to make 아 (a)."],["Which vowel represents 'o' as in 오?",["ㅗ","ㅜ","ㅓ","ㅣ"],0,"ㅗ is the vowel in 오 (o)."],["Which consonant begins 나?",["ㄴ","ㄷ","ㅁ","ㅂ"],0,"나 begins with ㄴ (n)."],["Which syllable is made from ㅁ + ㅏ?",["마","나","바","다"],0,"ㅁ plus ㅏ forms 마 (ma)."],["Which syllable is made from ㄱ + ㅜ?",["구","고","가","기"],0,"ㄱ plus ㅜ forms 구 (gu)."],["Which word means 'mother'?",["엄마","아빠","언니","할아버지"],0,"엄마 means mum or mother."],["Which word means 'father'?",["아빠","엄마","누나","할머니"],0,"아빠 means dad or father."],["Which word means 'grandmother'?",["할머니","할아버지","오빠","동생"],0,"할머니 means grandmother."],["Complete: 우리 ___은 네 명이에요. (There are four people in my family.)",["가족","학교","책상","가방"],0,"가족 means family."],["Which sentence asks 'What is your name?'",["이름이 뭐예요?","어디에 있어요?","몇 개예요?","뭐 해요?"],0,"이름이 뭐예요? asks someone's name politely."],["Which sentence means 'My name is Mina'?",["제 이름은 미나예요.","미나는 어디예요?","미나가 없어요.","이것은 미나예요?"],0,"제 이름은 미나예요 means My name is Mina."],["Which word means 'younger sibling'?",["동생","부모님","할머니","아버지"],0,"동생 means a younger sibling."],["Which word means 'inside'?",["안","밖","위","옆"],0,"안 means inside."],["Which word means 'under/below'?",["아래","위","앞","뒤"],0,"아래 means below or under."],["Which word means 'next to/beside'?",["옆","안","밖","뒤"],0,"옆 means beside."],["Complete: 책이 책상 ___에 있어요. (The book is on the desk.)",["위","아래","밖","뒤"],0,"책상 위에 means on top of the desk."],["Which question asks 'Where is the bag?'",["가방이 어디에 있어요?","가방이 몇 개예요?","가방이 누구예요?","가방이 뭐 해요?"],0,"어디에 있어요? asks where something is."],["Which answer means 'It is under the chair'?",["의자 아래에 있어요.","의자 위에 있어요.","의자 옆에 있어요.","의자 앞에 있어요."],0,"아래에 있어요 means it is underneath."],["Which word means 'school'?",["학교","병원","공원","시장"],0,"학교 means school."],["Which word means 'hospital'?",["병원","학교","도서관","공원"],0,"병원 means hospital."],["Which word means 'library'?",["도서관","식당","시장","집"],0,"도서관 means library."],["Complete: 책을 빌리러 ___에 가요. (I go to borrow books.)",["도서관","병원","운동장","식당"],0,"You borrow books from a library, 도서관."],["Which question means 'Where are you going?'",["어디에 가요?","뭐 먹어요?","몇 살이에요?","누구예요?"],0,"어디에 가요? asks where someone is going."],["Which word means 'to eat'?",["먹다","자다","읽다","걷다"],0,"먹다 means to eat."],["Which word means 'to read'?",["읽다","쓰다","보다","자다"],0,"읽다 means to read."],["Complete: 저는 물을 ___. (I drink water.)",["마셔요","먹어요","자요","읽어요"],0,"마셔요 means drink; 물을 마셔요 means drink water."],["Which word means 'three' in native Korean counting?",["셋","둘","넷","다섯"],0,"셋 is native Korean for three."],["Which word means 'seven' in Sino-Korean counting?",["칠","육","팔","구"],0,"칠 is seven in Sino-Korean."],["How do you say 'two apples' using the native Korean counter?",["사과 두 개","사과 이 개","사과 두 명","사과 둘 살"],0,"Use 두 before the counter 개 for two objects."],["Complete: 저는 아홉 ___이에요. (I am nine years old.)",["살","개","명","권"],0,"살 is the age counter used with native Korean numbers."]],"Malay":[],"Math":[],"Science":[["Which tool measures the volume of a liquid?",["Measuring cylinder","Thermometer","Ruler","Weighing scale"],0,"A measuring cylinder measures liquid volume in millilitres."],["What should you do before starting a science investigation?",["Read instructions carefully","Taste the materials","Run around the room","Mix all chemicals"],0,"Read and follow instructions before using equipment."],["A prediction in an investigation is…",["An expected outcome based on evidence","A measurement tool","A final result already proved","A safety sign"],0,"A prediction states what you think will happen before testing."],["Which action is safe in the science room?",["Tell the teacher about broken glass","Touch unknown liquids","Smell chemicals closely","Eat during an experiment"],0,"Report broken glass and let the teacher handle it."],["Which teeth are mainly used to cut food?",["Incisors","Molars","Premolars","Wisdom teeth"],0,"Incisors are the front teeth used for biting and cutting."],["Which teeth mainly grind food?",["Molars","Incisors","Canines","Milk teeth"],0,"Molars have broad surfaces that crush and grind food."],["What is the correct order of the first three digestive organs food passes through?",["Mouth → oesophagus → stomach","Stomach → mouth → intestine","Mouth → stomach → oesophagus","Oesophagus → mouth → stomach"],0,"Food moves from the mouth through the oesophagus to the stomach."],["Where are most nutrients absorbed into the blood?",["Small intestine","Mouth","Oesophagus","Large intestine"],0,"The small intestine absorbs most digested nutrients."],["Which animal is a herbivore?",["Cow","Tiger","Eagle","Shark"],0,"Cows eat plants, so they are herbivores."],["Which animal is an omnivore?",["Chicken","Cow","Lion","Rabbit"],0,"Chickens eat both plant and animal matter."],["Why do carnivores often have sharp canine teeth?",["To tear meat","To grind grass","To suck nectar","To crush seeds only"],0,"Sharp canines help carnivores grip and tear flesh."],["Which animal's teeth are best suited for grinding plants?",["Goat","Tiger","Crocodile","Eagle"],0,"Goats have broad grinding teeth for plant food."],["Which plant can reproduce using a stem cutting?",["Rose","Mango from seed","Fern from spores","Moss from spores"],0,"Roses can grow from planted stem cuttings."],["Which plant commonly reproduces using spores?",["Fern","Mango tree","Sunflower","Papaya tree"],0,"Ferns reproduce by spores rather than seeds."],["Which part of a flowering plant can develop into a fruit after fertilisation?",["Ovary","Root","Leaf","Stem"],0,"The flower's ovary develops into a fruit."],["A square has sides of 4 cm. What is its area?",["16 cm²","8 cm²","12 cm²","20 cm²"],0,"Area of a square is side × side: 4 × 4 = 16 cm²."],["A rectangle is 6 cm long and 3 cm wide. What is its area?",["18 cm²","9 cm²","18 cm","36 cm²"],0,"Area = length × width = 6 × 3 = 18 cm²."],["A measuring cylinder reads 35 mL. After a stone is fully submerged it reads 47 mL. What is the stone's volume?",["12 cm³","47 cm³","35 cm³","82 cm³"],0,"Displaced water = 47 − 35 = 12 mL, equal to 12 cm³."],["Which unit is suitable for the volume of water in a cup?",["Millilitres","Centimetres","Grams","Degrees Celsius"],0,"Liquid volume can be measured in millilitres (mL)."],["A wooden block floats on water. What can you conclude?",["It is less dense than water","It has no mass","It is heavier than every stone","It has no volume"],0,"An object less dense than water floats."],["Which object is most likely to sink in plain water?",["Steel nail","Cork","Dry leaf","Empty sealed plastic bottle"],0,"A steel nail is denser than water and sinks."],["Why does oil form a layer above water?",["Oil is less dense and does not mix with water","Oil has no mass","Water turns into oil","Oil is always hotter"],0,"Oil is generally less dense than water and does not mix with it."],["Which substance is usually acidic?",["Lemon juice","Soap solution","Baking soda solution","Toothpaste"],0,"Lemon juice contains citric acid."],["What colour does blue litmus paper turn in an acid?",["Red","Blue","Green","Yellow"],0,"Acids turn blue litmus paper red."],["What happens to red litmus paper in an alkaline solution?",["It turns blue","It turns redder","It turns black","It disappears"],0,"Alkalis turn red litmus paper blue."],["Which planet is closest to the Sun?",["Mercury","Venus","Earth","Mars"],0,"Mercury is the closest planet to the Sun."],["Which is the correct order of these planets moving away from the Sun?",["Earth → Mars → Jupiter","Jupiter → Earth → Mars","Mars → Jupiter → Earth","Earth → Jupiter → Mars"],0,"Earth is followed by Mars and then Jupiter."],["Why does the Sun appear much larger than other stars in the sky?",["It is much closer to Earth","It is the only star","Other stars are planets","It has no light"],0,"The Sun is our nearest star, so it appears much larger."],["What is the main purpose of a fixed pulley?",["Change the direction of a pulling force","Make an object weightless","Create energy","Measure temperature"],0,"A fixed pulley changes the direction of the force used to lift a load."],["A flag is raised using a rope over a wheel. Which simple machine is being used?",["Pulley","Wedge","Screw","Inclined plane"],0,"A flagpole commonly uses a pulley to raise and lower the flag."]],"PJPK":[]};

const interactive={"Science":{"text":{"0":["What instrument measures the volume of a liquid?","measuring cylinder","A measuring cylinder measures liquid volume."],"4":["What are the front teeth used for cutting food called?","incisors","Incisors cut and bite food."],"9":["What do we call an animal that eats both plants and animals?","omnivore","An omnivore eats both plants and animals."],"15":["A square has sides of 4 cm. What is its area in cm²? Type the number.","16","4 × 4 = 16 cm²."],"17":["A stone raises water from 35 mL to 47 mL. What is its volume in cm³? Type the number.","12","47 − 35 = 12 cm³."],"25":["Which planet is closest to the Sun?","mercury","Mercury is the closest planet to the Sun."]},"tf":{"2":["A prediction describes what you expect to happen before testing.",true,"A prediction is made before an investigation."],"6":["Food travels from the stomach to the mouth through the oesophagus.",false,"Food travels from the mouth through the oesophagus to the stomach."],"12":["Ferns commonly reproduce using seeds.",false,"Ferns commonly reproduce using spores."],"19":["An object less dense than water usually floats in water.",true,"Objects less dense than water float."],"23":["Blue litmus paper turns red in an acidic solution.",true,"Acids turn blue litmus red."],"28":["A fixed pulley makes a load completely weightless.",false,"A fixed pulley changes the direction of the pulling force; it does not remove weight."]},"order":{"7":["Put these digestive organs in the order food passes through them.",["Mouth","Oesophagus","Stomach","Small intestine"],"Food travels through the mouth, oesophagus, stomach, then small intestine."],"14":["Put these stages of a flowering plant's life cycle in order.",["Seed","Seedling","Mature flowering plant","Fruit with seeds"],"A seed grows into a seedling, then a mature plant that produces fruit and seeds."],"26":["Arrange these planets from closest to farthest from the Sun.",["Mercury","Venus","Earth","Mars"],"The first four planets are Mercury, Venus, Earth and Mars."]},"match":{"11":["Match each animal to its eating habit.",[["Cow","Herbivore"],["Tiger","Carnivore"],["Chicken","Omnivore"]],"Cows eat plants, tigers eat animals, and chickens eat both."],"21":["Match each object to what it usually does in water.",[["Cork","Floats"],["Steel nail","Sinks"],["Cooking oil","Forms a top layer"]],"Cork floats, steel sinks, and oil floats as a separate layer."],"24":["Match each solution to its usual property.",[["Lemon juice","Acidic"],["Soap solution","Alkaline"],["Pure water","Neutral"]],"Lemon juice is acidic, soap solution is alkaline, and pure water is neutral."]}},"Korean":{"text":{"0":["Type the Korean vowel used in 아 (a).","ㅏ","ㅏ is the vowel in 아."],"3":["Combine ㅁ and ㅏ. Type the completed Korean syllable.","마","ㅁ + ㅏ = 마."],"5":["Type the Korean word for 'mother'.","엄마","엄마 means mother."],"8":["Complete the Korean sentence: 우리 ___은 네 명이에요. (There are four people in my family.)","가족","가족 means family."],"18":["Type the Korean word for 'school'.","학교","학교 means school."],"26":["Type the native Korean number for three.","셋","셋 means three in native Korean."]},"tf":{"1":["The Korean vowel ㅜ is pronounced 'u' as in 우.",true,"ㅜ is the vowel in 우."],"6":["아빠 means 'grandmother'.",false,"아빠 means father or dad."],"12":["The Korean location word 안 means 'inside'.",true,"안 means inside."],"16":["어디에 있어요? asks where something is.",true,"어디에 있어요? means 'Where is it?'"],"23":["먹다 means 'to sleep'.",false,"먹다 means 'to eat'; 자다 means 'to sleep'."],"28":["In 사과 두 개, the counter 개 is used for objects.",true,"개 is a general counter for objects."]},"order":{"10":["Arrange these words to say 'My name is Mina.'",["제","이름은","미나예요."],"제 이름은 미나예요 means 'My name is Mina.'"],"15":["Arrange these words to say 'The book is on the desk.'",["책이","책상","위에","있어요."],"책이 책상 위에 있어요 means 'The book is on the desk.'"],"25":["Arrange these words to say 'I drink water.'",["저는","물을","마셔요."],"저는 물을 마셔요 means 'I drink water.'"]},"match":{"7":["Match each family word to its meaning.",[["할머니","Grandmother"],["할아버지","Grandfather"],["동생","Younger sibling"]],"할머니 is grandmother, 할아버지 grandfather, and 동생 younger sibling."],"14":["Match each location word to its meaning.",[["위","Above"],["아래","Below"],["옆","Beside"]],"위 means above, 아래 below, and 옆 beside."],"20":["Match each place to its English meaning.",[["병원","Hospital"],["도서관","Library"],["시장","Market"]],"병원 is hospital, 도서관 library, and 시장 market."]}}};
function decorate(q,i){let d=interactive[subject]||{};for(let type of ['text','tf','order','match']){let x=d[type]&&d[type][i];if(x){q.q=x[0];q.type=type;if(type==='text'){q.expected=x[1];q.explanation=x[2]}if(type==='tf'){q.expected=x[1];q.explanation=x[2]}if(type==='order'){q.steps=x[1];q.explanation=x[2]}if(type==='match'){q.pairs=x[1];q.explanation=x[2]}break}}return q}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(v){return String(v).normalize('NFC').trim().toLowerCase().replace(/\\s+/g,' ').replace(/[.,!?。]/g,'')}
let orderChosen=[];
function pickStep(i){if(answered||orderChosen.includes(i))return;orderChosen.push(i);paintSteps();if(orderChosen.length===questions[index].steps.length)submitAnswer()}
function undoStep(){if(answered)return;orderChosen.pop();paintSteps()}
function paintSteps(){let q=questions[index];$('answers').innerHTML='<div class="sequence"><div class="sequencepicked">'+(orderChosen.map((i,k)=>'<span class="picked">'+(k+1)+'. '+escapeHtml(q.shuffled[i])+'</span>').join('')||'<span class="faint">Tap the steps in the correct order.</span>')+'</div><div class="stepgrid">'+q.shuffled.map((v,i)=>'<button class="answer step" '+(orderChosen.includes(i)?'disabled':'')+' onclick="pickStep('+i+')">'+escapeHtml(v)+'</button>').join('')+'</div><button class="undo" onclick="undoStep()">Undo last step</button></div>'}
function getInput(){let q=questions[index];if(q.type==='text')return $('typedAnswer').value;if(q.type==='tf')return selected===0;if(q.type==='order')return orderChosen.map(i=>q.shuffled[i]);if(q.type==='match')return q.pairs.map((p,i)=>$('match'+i).value);return selected}
function rainbow(s){return [...s].map((c,i)=>c===' '?' ': '<span style="color:'+colors[i%4]+'">'+c+'</span>').join('')}
function show(id){document.querySelectorAll('.screen').forEach(el=>el.classList.add('hidden'));$(id).classList.remove('hidden');window.scrollTo(0,0)}
function home(){clearInterval(timerHandle);show('home')}
function exitQuiz(){clearInterval(timerHandle);timerHandle=null;answered=false;selected=-1;show('selection')}
function choose(s){subject=s;clearInterval(timerHandle);$('subjectTitle').innerHTML=rainbow(s);$('versions').innerHTML=Array.from({length:(sample[s]&&sample[s].length?1:0)},(_,i)=>'<button class="version" onclick="start('+(i+1)+')">'+s+' volume '+(i+1)+'</button>').join('')||'<p style="text-align:center;font-size:20px;color:#525EA7">No quiz available yet.</p>';show('selection')}
function start(v){version=v;index=0;score=0;wrongQuestions=[];questions=sample[subject].map((q,i)=>decorate({q:q[0],options:q[1],correct:q[2],explanation:q[3],type:'mc'},i));time=questions.length*180;$('quizSubject').textContent=subject;show('quiz');if(!questions.length){$('number').textContent='';$('questionTitle').textContent='No questions added yet.';$('prompt').textContent='';$('answers').innerHTML='';$('questioncount').textContent='Question 0 out of 0';$('timer').textContent='0:00:00';clearInterval(timerHandle);return}render();clearInterval(timerHandle);timerHandle=setInterval(()=>{time--;updateClock();if(time<=0)finish()},1000)}
function updateClock(){let t=Math.max(0,time),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;$('timer').textContent=h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function render(){selected=-1;answered=false;orderChosen=[];$('nextButton').disabled=true;let q=questions[index];$('number').textContent=index+1;$('questionTitle').textContent=q.q;$('prompt').textContent='';let a=$('answers');a.className='answers';if(q.type==='mc'){a.innerHTML=q.options.map((o,i)=>'<button class="answer" onclick="selectAnswer('+i+')"><span class="letter">'+('ABCD'[i])+'</span><span>'+escapeHtml(o)+'</span></button>').join('')}else if(q.type==='tf'){a.innerHTML=['True','False'].map((v,i)=>'<button class="answer" onclick="selectAnswer('+i+')"><span class="letter">'+('AB'[i])+'</span><span>'+v+'</span></button>').join('')}else if(q.type==='text'){a.innerHTML='<input id="typedAnswer" class="typebox" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer here" aria-label="Your answer" onkeydown="if(event.key===\'Enter\'){event.preventDefault();submitAnswer()}">'}else if(q.type==='order'){q.shuffled=q.steps.map((v,i)=>({v,k:(i*7+3)%q.steps.length})).sort((a,b)=>b.k-a.k).map(x=>x.v);if(q.shuffled.every((v,i)=>v===q.steps[i]))q.shuffled.reverse();paintSteps()}else if(q.type==='match'){let values=q.pairs.map(p=>p[1]).reverse();a.innerHTML='<div class="matching">'+q.pairs.map((p,i)=>'<label class="matchrow"><span>'+escapeHtml(p[0])+'</span><select onchange="checkMatches()" id="match'+i+'" aria-label="Match '+escapeHtml(p[0])+'"><option value="">Choose meaning</option>'+values.map(v=>'<option value="'+escapeHtml(v)+'">'+escapeHtml(v)+'</option>').join('')+'</select></label>').join('')+'</div>'}$('questioncount').textContent='Question '+(index+1)+' out of '+questions.length;document.querySelector('.helper').textContent=q.type==='order'?'Tap all steps in order to submit.':q.type==='match'?'Match every item to submit.':q.type==='text'?'Type your answer and press Enter to submit.':'Tap an answer to submit.';updateClock()}
function selectAnswer(i){if(answered)return;selected=i;[...$('answers').querySelectorAll('.answer')].forEach((b,j)=>b.classList.toggle('selected',j===i));submitAnswer()}
function checkMatches(){if(!answered&&questions[index].pairs.every((p,i)=>$('match'+i).value))submitAnswer()}
function submitAnswer(){
 if(answered){advance();return}
 if(!questions.length)return;
 let q=questions[index],v=getInput();
 if(q.type==='text'&&!normalize(v))return;
 if((q.type==='mc'||q.type==='tf')&&selected<0)return;
 if(q.type==='order'&&v.length!==q.steps.length)return;
 if(q.type==='match'&&v.some(x=>!x))return;
 answered=true;$('nextButton').disabled=false;
 let correct=q.type==='mc'?v===q.correct:q.type==='tf'?v===q.expected:q.type==='text'?normalize(v)===normalize(q.expected):q.type==='order'?v.every((x,i)=>x===q.steps[i]):v.every((x,i)=>x===q.pairs[i][1]);
 if(correct)score++;else wrongQuestions.push({number:index+1,question:q.q});
 let answerBox;
 if(q.type==='mc'||q.type==='tf'){answerBox=$('answers').querySelectorAll('.answer')[selected]}
 else if(q.type==='text'){answerBox=$('typedAnswer');answerBox.readOnly=true}
 else if(q.type==='order'){answerBox=$('answers').querySelector('.sequencepicked')}
 else if(q.type==='match'){answerBox=$('answers').querySelector('.matching');$('answers').querySelectorAll('select').forEach(x=>x.disabled=true)}
 if(answerBox){
  answerBox.classList.add(correct?'answer-correct':'answer-wrong');
  let feedback=document.createElement('span');feedback.className='inline-feedback';feedback.setAttribute('role','status');
  let symbol=document.createElement('span');symbol.className='feedback-symbol';symbol.textContent=correct?'✓':'✕';
  let explanation=document.createElement('span');explanation.className='feedback-explanation';explanation.textContent=q.explanation;
  feedback.append(symbol,explanation);
  if(q.type==='text'){let wrap=document.createElement('div');wrap.className='typed-feedback-wrap';answerBox.parentNode.insertBefore(wrap,answerBox);wrap.append(answerBox,feedback)}
  else answerBox.appendChild(feedback);
 }
 $('answers').querySelectorAll('button.answer').forEach(x=>x.disabled=true);
 $('answers').querySelectorAll('.undo').forEach(x=>x.disabled=true);
 $('answers').querySelectorAll('input').forEach(x=>x.readOnly=true);
 $('answers').querySelectorAll('select').forEach(x=>x.disabled=true);
 document.querySelector('.helper').textContent='Press Next to continue.';
}
function advance(){if(!answered)return;index++;if(index>=questions.length)finish();else render()}
function finish(){clearInterval(timerHandle);$('score').textContent=score;$('total').textContent=questions.length;show('results')}
function restart(){start(version)}
function downloadScore(){let lines=['Quiz time','Subject: '+subject,'Quiz: '+subject+' volume '+version,'Score: '+score+'/'+questions.length,''];for(const item of wrongQuestions){lines.push('('+item.number+') '+item.question);lines.push('')}lines.push('Date: '+new Date().toLocaleString());let content=lines.join('\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='score.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
$('subjects').innerHTML=names.map(n=>'<button class="tile" onclick="choose(\''+n+'\')">'+n+'</button>').join('');document.querySelector('#home .rainbow').innerHTML=rainbow('Quiz time');let initial=new URLSearchParams(location.search).get('subject');if(initial){let match=names.find(n=>n.toLowerCase()===initial.toLowerCase());if(match)choose(match)}
</script></body></html>
