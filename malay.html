<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Malay — Isaac Quiz</title><style>:root{font-family:ui-rounded,'Trebuchet MS',Arial,sans-serif;color:#1F1C47;background:#eef0ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 20%,#d9c9fa,transparent 40%),radial-gradient(circle at 95% 75%,#bbdfff,transparent 38%),#f4f2ff}header{background:linear-gradient(105deg,#593C96,#326CB6);color:white;padding:22px 5%;border-radius:0 0 28px 28px;box-shadow:0 9px 28px #29226330}.bar{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:clamp(25px,4vw,40px);font-weight:1000;letter-spacing:-1px}.logo em{font-style:normal;color:#f1a7e7}a{text-decoration:none;color:inherit}.back{background:#ffffff2e;border:1px solid #ffffff77;border-radius:99px;padding:11px 18px;font-weight:800}main{max-width:1000px;margin:45px auto;padding:0 20px}.hero{background:#ffffffd9;border:1px solid white;border-radius:32px;padding:36px;box-shadow:0 15px 45px #2e27601b;display:flex;align-items:center;justify-content:space-between;gap:25px}.hero h1{font-size:clamp(30px,5vw,53px);margin:0 0 12px;color:#33217c}.hero p{font-size:18px;color:#5e5880;line-height:1.6;margin:0}.mascot{font-size:95px;filter:drop-shadow(0 8px 4px #39287520)}h2{margin:32px 5px 20px;font-size:26px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:17px}.card{border:2px solid #ffffffb8;border-radius:26px;padding:26px 18px;min-height:175px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;color:white;font-size:23px;font-weight:900;box-shadow:0 7px 0 #302b6720,0 14px 20px #31246c16;transition:transform .2s}.card:hover{transform:translateY(-5px)}.card span{font-size:43px}.card:nth-child(5n+1){background:linear-gradient(135deg,#C674CE,#a953b8)}.card:nth-child(5n+2){background:linear-gradient(135deg,#593C96,#3d2489)}.card:nth-child(5n+3){background:linear-gradient(135deg,#3287AE,#276b9e)}.card:nth-child(5n+4){background:linear-gradient(135deg,#326CB6,#558ee9)}.card:nth-child(5n){background:linear-gradient(135deg,#1F1C47,#393b80)}.version{display:flex;flex-direction:row;justify-content:space-between;text-align:left;min-height:125px}.version span{font-size:26px}.version small{font-size:13px;opacity:.85}.soon{opacity:.7;cursor:default}.foot{color:#726b91;text-align:center;margin:32px}@media(max-width:550px){main{margin:22px auto}.hero{padding:25px;gap:10px}.mascot{font-size:58px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:140px;padding:15px 10px;font-size:18px}.card span{font-size:32px}}</style></head><body><header><div class="bar"><a class="logo" href="./">Isaac <em>Quiz</em></a><a class="back" href="./">⌂ Home</a></div></header><main><section class="hero"><div><h1>Malay</h1><p>Quiz versions will appear here when ready.</p></div><div class="mascot">🐱</div></section><h2>Available quizzes</h2><p>No quizzes published yet.</p></main></body></html>
